<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // forEach를 사용하여 전체 학생의 평균 점수를 계산하세요.
    const students = [
      { name: '김철수', score: 85 },
      { name: '이영희', score: 92 },
      { name: '박민수', score: 78 },
      { name: '정지원', score: 90 }
    ]

    // 1. 학생 수와 점수 합계를 담을 변수 준비
    let numberOfStudent = students.length
    let sumOfScores = 0 // 반복하며 값이 바뀌므로 let

    // 2. forEach로 학생을 한 명씩 꺼내 점수를 누적
    students.forEach((student) => {
      sumOfScores += student.score
    })

    // 3. 평균 계산
    const result = sumOfScores / numberOfStudent
    console.log(result) // 86.25
  </script>
</body>

</html>
