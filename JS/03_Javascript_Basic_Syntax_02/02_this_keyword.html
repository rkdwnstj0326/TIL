<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // this: 함수를 "호출한 방법"에 따라 가리키는 대상이 달라지는 키워드
    // - 헷갈릴 때는 "누가 점(.)을 찍어 호출했는가?"를 보면 됨

    // Method & this 예시
    const person = {
      name: 'Alice',
      greeting: function () {
        return `Hello my name is ${this.name}` // this = person
      },
    }

    console.log(person.greeting()) // Hello my name is Alice


    // 1.1 단순 호출
    // - 점 앞에 아무것도 없이 호출 -> 전역 객체(window)
    const myFunc = function () {
      return this
    }
    console.log(myFunc()) // window

    // 1.2 메서드 호출
    // - 객체.메서드() 로 호출 -> 점 앞의 객체
    const myObj = {
      data: 1,
      myFunc: function () {
        return this
      }
    }
    console.log(myObj.myFunc()) // myObj

    // 2. 중첩된 함수
    // 2.1 일반 함수
    // - forEach에 넘긴 콜백은 forEach가 "단순 호출"하므로 this가 window가 됨
    const myObj2 = {
      numbers: [1, 2, 3],
      myFunc: function () {
        this.numbers.forEach(function (number) {
          console.log(this) // window
        })
      }
    }
    console.log(myObj2.myFunc()) // (위 출력 3번 후) undefined: myFunc에 return이 없으므로

    // 2.2 화살표 함수
    // - 화살표 함수는 자신만의 this가 없어서, 바깥 함수(myFunc)의 this를 그대로 사용
    const myObj3 = {
      numbers: [1, 2, 3],
      myFunc: function () {
        this.numbers.forEach((number) => {
          console.log(this) // myObj3
        })
      }
    }
    console.log(myObj3.myFunc()) // (위 출력 3번 후) undefined

    // => 메서드 안에서 콜백을 쓸 때는 화살표 함수가 안전함

  </script>
</body>

</html>
