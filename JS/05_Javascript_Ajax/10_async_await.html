<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
    then을 계속 이어 쓰면 코드가 길어지고, 흐름을 따라가기 어렵다.
    비동기 코드를 위에서 아래로 읽히게 쓰고 싶다. => async / await

    async
    - 함수 앞에 작성
    - 함수 내부에서 await 키워드를 사용할 수 있게 해줌 (주된 이유)
    - async 함수는 항상 Promise 객체를 반환

    await
    - Promise 앞에 작성
    - Promise가 완료될 때까지 "async 함수 안의 코드"만 잠시 멈추고, 결과값을 돌려줌
      (브라우저 전체가 멈추는 것은 아님. 함수 밖의 코드는 계속 실행됨)
    - await 뒤의 값이 Promise가 아니면 그 값을 그대로 돌려줌
    - async 함수 안에서만 사용할 수 있음
    */

    // promise.html과 같은 함수 (1초 뒤 50% 확률로 성공 또는 실패)
    const getRandomData = function () {
      return new Promise((resolve, reject) => {
        const success = Math.random() > 0.5

        setTimeout(() => {
          if (success) {
            resolve('데이터 도착!')
          } else {
            reject('에러 발생!')
          }
        }, 1000)
      })
    }

    // promise.html의 "3번 연속 호출"을 async/await로 바꾼 버전
    // [실습 포인트/힌트] 함수 표현식 앞에 async: const main = async function () { }
    // [실습 포인트/힌트] const 결과 = await getRandomData() - then 없이 결과를 변수로 바로 받음
    // [실습 포인트/힌트] 실패 처리는 try { } catch (error) { } - try 안의 await 중 하나라도 실패하면 바로 catch로 이동
    // TODO: async 함수 main을 만들고, try 안에서 getRandomData를 await로 3번 호출하며
    //       '1번째 성공:', '2번째 성공:', '3번째 성공:'과 결과를 출력하세요.
    //       catch에서는 '중간에 실패함:'과 error를 출력하세요.
    // [실습 포인트/힌트] 참고: 작성한 뒤 같은 3번 호출을 for 반복문 안에서 await로 바꿔 보기 (반복문과도 함께 사용할 수 있음)

    // TODO: main 함수를 만든 뒤, 아래 두 줄의 주석을 풀어 실행하세요.
    // main()

    // main 안의 await는 main 함수 안쪽만 멈추게 함
    // 그래서 이 줄은 main의 결과를 기다리지 않고 가장 먼저 출력됨
    // console.log('main 호출 직후')

    // 참고: 일반 <script>의 최상단(함수 밖)에서는 await를 쓸 수 없음 (SyntaxError)
  </script>
</body>

</html>
