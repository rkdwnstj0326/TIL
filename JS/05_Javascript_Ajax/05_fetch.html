<!-- fetch.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // fetch: 브라우저에 내장된 HTTP 요청 함수 (설치 없음, Promise 반환)
    // 이후 수업에서는 axios를 사용하므로, 여기서는 "왜 axios를 쓰는지" 확인하는 용도로만 봅니다.

    // 1. fetch 기본 사용
    // - fetch(API_URL)은 요청을 보내고 Promise를 반환
    // - response.json()(본문 JSON -> 객체 변환)도 Promise를 반환하므로 then을 한 번 더 연결
    const API_URL = 'https://api.thecatapi.com/v1/images/search'

    fetch(API_URL)
      .then((response) => {
        console.log(response) // Response 객체 (아직 본문 데이터를 꺼내기 전)
        return response.json() // 반드시 return 해야 다음 then에서 데이터를 받음
      })
      .then((data) => {
        console.log(data[0].url)
      })
      .catch((error) => {
        console.log(error)
      })

    // 2. fetch의 불편한 점: 실패 응답(404, 500 등)이어도 catch로 가지 않음
    // - 서버가 "응답은 했기 때문에" fetch는 성공으로 처리
    // - 실패 여부(response.ok)를 직접 확인하고, 직접 에러를 발생시켜야 함
    // - 아래 주소는 존재하지 않는 게시글 (404 응답)
    const WRONG_URL = 'https://jsonplaceholder.typicode.com/posts/99999'

    fetch(WRONG_URL)
      .then((response) => {
        console.log('then 실행됨, 상태 코드:', response.status)
        if (!response.ok) {
          throw new Error(`요청 실패: ${response.status}`)
        }
        return response.json()
      })
      .then((data) => {
        console.log(data)
      })
      .catch((error) => {
        console.log('catch 실행됨:', error.message)
      })

    // => JSON 변환, 실패 확인을 매번 직접 해야 함
    // => 이 반복 작업을 대신 처리해 주는 라이브러리가 바로 axios
  </script>
</body>

</html>
