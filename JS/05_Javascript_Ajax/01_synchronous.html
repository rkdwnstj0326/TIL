<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 동기(Synchronous)
    // - 앞의 작업이 끝나야 다음 작업을 시작 (코드 순서 = 실행 순서)
    // - 오래 걸리는 작업이 있으면 그동안 다른 일을 전혀 하지 못함
    console.log('작업 1 시작')

    const syncTask = function () {
      // 10억 번 반복하는 동안 브라우저가 멈춘 것처럼 보임 (화면 클릭도 반응 없음)
      for (let i = 0; i < 1000000000; i++) {
        // 반복 실행 동안 잠시 대기
      }
      return '작업 완료'
    }

    const result = syncTask()
    console.log(result)

    console.log('작업 2 시작')

    // 출력결과
    // 작업 1 시작
    // (반복 실행 동안 잠시 대기)
    // 작업 완료
    // 작업 2 시작
  </script>
</body>

</html>
