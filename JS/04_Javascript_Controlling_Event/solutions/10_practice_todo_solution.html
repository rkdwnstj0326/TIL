<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <input type="text" class="input-text">
  <button id="btn">+</button>
  <ul></ul>

  <script>
    // 목표: Input창에 입력한 후 '+'버튼 클릭 시, 실시간으로 리스트에 출력하기

    // 1. 필요한 요소 선택
    const inputTag = document.querySelector('.input-text')
    const btn = document.querySelector('#btn')
    const ulTag = document.querySelector('ul')

    // 2. 할 일을 추가하는 함수 (이벤트 핸들러)
    const addTodo = function (event) {
      // 2.1 사용자 입력 데이터 저장
      const inputData = inputTag.value

      // 추가 기능)
      // if(inputData.trim()){} else { alert('할 일을 입력하세요.')}

      // 2.2 데이터를 저장할 li 요소를 생성 (아직 화면에는 없음)
      const liTag = document.createElement('li')

      // 2.3 li 요소 컨텐츠에 데이터 입력
      liTag.textContent = inputData

      // 2.4 li 요소를 부모 ul 요소의 자식 요소로 추가 (이때 화면에 보임)
      ulTag.appendChild(liTag)

      // 2.5 todo 추가 후 input의 입력 데이터는 초기화
      inputTag.value = ''
    }

    // 3. 버튼에 이벤트 핸들러를 등록
    btn.addEventListener('click', addTodo)

    // [추가 기능 완성본] 빈 문자열(공백 포함) 입력 방지
    // - 위의 addTodo 대신 사용 (같은 이름으로 두 번 선언하면 에러)
    // const addTodo = function (event) {
    //   const inputData = inputTag.value
    //   if (inputData.trim()) {
    //     const liTag = document.createElement('li')
    //     liTag.textContent = inputData
    //     ulTag.appendChild(liTag)
    //     inputTag.value = ''
    //   } else {
    //     alert('할 일을 입력하세요..')
    //   }
    // }

  </script>
</body>

</html>
