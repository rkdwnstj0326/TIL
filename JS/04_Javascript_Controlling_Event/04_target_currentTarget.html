<!-- target_currentTarget.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #outerouter {
      width: 300px;
      height: 300px;
      background-color: yellowgreen;
    }

    #outer {
      width: 200px;
      height: 200px;
      background-color: crimson;
    }

    #inner {
      width: 100px;
      height: 100px;
      background-color: skyblue;
    }
  </style>
</head>

<body>
  <div id="outerouter">
    outerouter 
    <div id="outer">
      outer
      <div id="inner">inner</div>
    </div>
  </div>

  <script>
    // target vs currentTarget
    // - currentTarget: 핸들러가 "연결된" 요소 (항상 outerouter, this와 같음)
    // - target: 이벤트가 "실제로 시작된" 가장 안쪽 요소 (클릭한 위치에 따라 달라짐)
    // - 핸들러는 outerouter에만 연결했지만, 버블링 덕분에 안쪽 요소를 클릭해도 실행됨
    const outerOuterElement = document.querySelector('#outerouter')

    const clickHandler = function (event) {
      console.log('currentTarget:', event.currentTarget.id) // 항상 outerouter
      console.log('target:', event.target.id) // inner를 클릭하면 inner, outer를 클릭하면 outer
    }

    outerOuterElement.addEventListener('click', clickHandler)
  </script>
</body>

</html>
