<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .card {
      width: 340px;
      border: 1px solid black;
      padding: 20px;
    }

    .profile {
      position: relative;
    }

    .profile img {
      width: 100%;
      max-width: 100%;
      display: block;
    }

    .profile .name {
      position: absolute;
      bottom: 0;
      left: 0;

      width: 100%;
      margin: 0;
      padding: 8px 0;

      text-align: center;
      font-size: 28px;
      font-weight: bold;
      background-color: rgba(255, 184, 128, 0.8);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="profile">
      <img src="profile.jpg" alt="Profile Image">
      <p class="name">Name</p>
    </div>

    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit.
      Adipisci unde officiis ad nostrum. Laboriosam mollitia
      similique provident fuga tenetur saepe sit, amet eaque
      neque eius quaerat expedita ea illum veniam.
    </p>
  </div>
</body>
</html>
