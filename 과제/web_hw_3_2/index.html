<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox OOCSS Exercise</title>
  <style>
    /* ==========================================
       1. 구조 (Structure) - 배치와 크기만 담당
       ========================================== */
    /* Flexbox 유틸리티: 양 끝 정렬 레이아웃 */
    .flex-space-between {
      display: flex;
      justify-content: space-between;
    }

    /* 컴포넌트 크기 정의 */
    .outer-box {
      width: 600px;
      height: 200px;
    }

    .inner-box {
      width: 300px;
      height: 200px;
    }

    .box {
      width: 100px;
      height: 100px;
    }

    /* ==========================================
       2. 스킨 (Skin) - 색상과 테두리 등 시각 효과만 담당
       ========================================== */
    .border-black-dotted {
      border: 1px dotted black;
    }

    .border-red-solid {
      border: 1px solid red;
    }

    .bg-skyblue {
      background-color: skyblue;
    }
  </style>
</head>
<body>

  <!-- HTML에서 구조 클래스와 스킨 클래스를 레고처럼 조립해서 사용 -->
  <div class="outer-box border-black-dotted">
    <div class="inner-box border-red-solid flex-space-between">
      <div class="box bg-skyblue">item1</div>
      <div class="box bg-skyblue">item2</div>
    </div>
  </div>

</body>
</html>
