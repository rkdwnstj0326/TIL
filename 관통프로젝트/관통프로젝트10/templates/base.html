<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">  
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <title>Document</title>
  <style>
    .book-card img {
      height: 300px;
      object-fit: cover;
    }
    .book-card .card-title {
      font-size: 1rem;
      font-weight: 600;
    }
    .book-card .card-text {
      font-size: 0.9rem;
      color: #666;
    }
    .book-card .card-subtitle {
      font-size: 0.8rem;
      color: #999;
    }
    .book-card .card-body {
      display: flex;
      flex-direction: column;
    }
    .book-card .card-subtitle {
      margin-top: auto;
    }
  </style>
</head>

<body>
  <nav class="navbar bg-success navbar-expand-lg border-bottom border-body mb-4" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'books:index' %}">ThRead</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto text-end mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="{% url 'books:index' %}">INDEX</a>
          </li>
          {% if request.user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:profile' user.username %}">MY PROFILE</a>
            </li>
            <li class="nav-item">
              <form action="{% url 'accounts:logout' %}" method="POST">
                {% csrf_token %}
                <input class="nav-link" type="submit" value="LOGOUT">
              </form>          
            </li>
          {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:login' %}">LOGIN</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:signup' %}">SIGNUP</a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
  
  <div class="container">
    {% block content %}
    {% endblock content %}
  </div>
  <p id="ajax-error" class="container text-danger" role="alert"></p>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    document.addEventListener('submit', async (event) => {
      const form = event.target;
      if (!form.matches('form[data-ajax]')) return;
      event.preventDefault();
      if (form.dataset.pending) return;
      const button = form.querySelector('[type=submit]');
      const error = document.querySelector('#ajax-error');
      form.dataset.pending = 'true';
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await axios.post(form.action, new FormData(form));
        form.dispatchEvent(new CustomEvent('ajax:success', {detail: response.data, bubbles: true}));
      } catch (failure) {
        error.textContent = failure.response?.data?.error || '요청을 처리하지 못했습니다. 다시 시도해 주세요.';
      } finally {
        button.disabled = false;
        delete form.dataset.pending;
      }
    });
  </script>
  {% block script %}{% endblock script %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
</body>
</html>
